"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fallback same-origin proxies to the Flask backend on Render.
# Note: Primary API calls use VITE_API_URL=https://evacway-2249.onrender.com directly
# to avoid Netlify's 26s proxy timeout during Render free-tier cold starts.
[[redirects]]
  from = "/api/*"
  to = "https://evacway-2249.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "https://evacway-2249.onrender.com/static/:splat"
  status = 200
  force = true

# SPA fallback for React Router client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
